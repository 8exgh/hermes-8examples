name: Deploy managed Hermes fleet

# The fleet box's runner is registered to the devops repo, so the rollout
# itself lives there (devops/.github/workflows/deploy-managed-hermes-fleet.yml:
# clone/update ~/managed-hermes, ensure hermes1..5, build the image, roll with
# a canary, register phone hooks, install the Rocket.Chat bridge). This
# workflow just asks devops to run it on every push to main, the same way
# 8examples triggers its own deploy. Needs the DEPLOY_TOKEN secret (a PAT
# with repo scope on 8exgh/devops).

on:
  workflow_dispatch:
    inputs:
      canary:
        description: Tenant to update first
        required: false
        default: hermes1
      ensure_count:
        description: Make sure hermes1..hermesN exist (0 = do not create any)
        required: false
        default: "5"
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the fleet rollout in devops
        env:
          CANARY: ${{ inputs.canary || 'hermes1' }}
          ENSURE_COUNT: ${{ inputs.ensure_count || '5' }}
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/8exgh/devops/dispatches \
            -d "$(jq -nc --arg canary "$CANARY" --arg count "$ENSURE_COUNT" \
              '{event_type:"deploy-managed-hermes-fleet",client_payload:{canary:$canary,ensure_count:$count}}')"
