name: Build fleet image and deploy managed Hermes fleet

# 1. Build image/ (upstream nousresearch/hermes-agent + Xvfb + headful
#    Chromium + hermes-telemetry) on a GitHub runner — the fleet box's egress
#    is too slow for the Chromium download — and push it to ghcr.
# 2. Ask devops to roll the fleet (its runner is the one registered on the
#    fleet box): devops/.github/workflows/deploy-managed-hermes-fleet.yml pulls
#    the image, pins the digest, re-renders and restarts every tenant with a
#    canary, registers phone hooks and installs the Rocket.Chat bridge.
#
# Nightly schedule = "everyone on the newest upstream Hermes" without a hand
# on the wheel. DEPLOY_TOKEN: PAT with packages:write + repo scope on devops.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # 04:00 Calgary
  workflow_dispatch:
    inputs:
      canary:
        description: Tenant to update first
        required: false
        default: hermes1
      ensure_count:
        description: Make sure hermes1..hermesN exist (0 = do not create any)
        required: false
        default: "5"

concurrency:
  group: hermes-fleet-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/8exgh/hermes-8examples

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_TOKEN }}

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: image
          platforms: linux/amd64
          pull: true # newest upstream nousresearch/hermes-agent every build
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.timestamp.outputs.timestamp }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the fleet rollout in devops
        env:
          CANARY: ${{ inputs.canary || 'hermes1' }}
          ENSURE_COUNT: ${{ inputs.ensure_count || '5' }}
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/8exgh/devops/dispatches \
            -d "$(jq -nc --arg canary "$CANARY" --arg count "$ENSURE_COUNT" \
              '{event_type:"deploy-managed-hermes-fleet",client_payload:{canary:$canary,ensure_count:$count}}')"
